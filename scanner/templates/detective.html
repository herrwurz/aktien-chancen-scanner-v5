<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HEBELTRADER-Detektiv</title>
  <style>
    body{font:16px system-ui;margin:auto;max-width:900px;padding:1rem;background:#f5f7fa;color:#16202a}
    main,article{background:white;border-radius:12px;padding:1rem;margin:1rem 0;box-shadow:0 2px 10px #0001}
    label{display:block;font-weight:650;margin-top:1rem}textarea,input,button{box-sizing:border-box;width:100%;padding:.75rem;margin-top:.4rem}
    textarea{min-height:10rem}button{background:#164e63;color:white;border:0;border-radius:8px;font-weight:700}
    .warning{border-left:4px solid #d97706;padding:.75rem;background:#fffbeb}.candidate{border-top:1px solid #ddd}
    code{overflow-wrap:anywhere}@media(max-width:600px){body{padding:.5rem}}
  </style>
</head>
<body><main>
  <h1>HEBELTRADER analysieren</h1>
  <p class="warning">Die Rangliste ist eine Identifikationshilfe und keine Kaufempfehlung. Treffer
  und Optionsscheindaten müssen anhand zeitgerechter Originalquellen geprüft werden.</p>
  <form id="form">
    <label for="text">Teasertext</label><textarea id="text" maxlength="20000"></textarea>
    <label for="published">Veröffentlichungszeit</label><input id="published" type="datetime-local">
    <label for="image">Screenshot oder PDF (Bilder maximal 2 MiB; PDF maximal 20 MiB/40 Seiten)</label>
    <input id="image" type="file" accept="image/png,image/jpeg,image/webp,application/pdf">
    <button>Hinweise analysieren</button>
  </form>
  <section id="result" aria-live="polite"></section>
</main><script>
const form=document.querySelector('#form'), result=document.querySelector('#result');
const asBase64=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;
  r.onload=()=>resolve(r.result.split(',')[1]);r.readAsDataURL(file)});
form.addEventListener('submit',async event=>{event.preventDefault();result.textContent='Analyse läuft …';
  const file=document.querySelector('#image').files[0];
  const published=document.querySelector('#published').value;
  const body={teaser_text:document.querySelector('#text').value,
    publication_at:published?new Date(published).toISOString():null};
  if(file&&file.type==='application/pdf'){body.pdf_base64=await asBase64(file);
    body.pdf_media_type=file.type}else if(file){body.screenshot_base64=await asBase64(file);
    body.screenshot_media_type=file.type}
  const response=await fetch('/api/hebeltrader/detective/analyze',{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const data=await response.json();if(!response.ok){result.textContent=data.detail||'Analysefehler';return}
  result.replaceChildren();const heading=document.createElement('h2');heading.textContent='Kandidaten';
  result.append(heading);if(!data.candidates.length){const empty=document.createElement('p');
    empty.textContent='Keine belastbaren Kandidaten.';result.append(empty);return}
  data.candidates.forEach((c,i)=>{const article=document.createElement('article');
    article.className='candidate';const identity=c.identity||c;const title=document.createElement('h3');
    title.textContent=`${i+1}. ${identity.name} (${identity.ticker||'ohne Ticker'})`;article.append(title);
    const summary=document.createElement('p');summary.textContent=`WKN ${identity.wkn||'unbekannt'}, `+
      `Evidenzwert: ${c.evidence_score??c.relevance_score_not_probability}`;
    article.append(summary);const evidence=document.createElement('p');
    evidence.textContent=c.evidence_matrix?c.evidence_matrix.map(e=>`${e.clue_id}: ${e.status}`).join(', '):
      [...c.hard_facts,...c.supporting_clues].map(e=>e.value).join(', ');
    article.append(evidence);const status=document.createElement('p');
    status.textContent='Bestätigung: manuell erforderlich';article.append(status);result.append(article)});
});
</script></body></html>
