name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: scanner_test
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scanner -d scanner_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scanner:ci-disposable-only@127.0.0.1:5432/scanner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-disposable-only
      - run: docker compose --profile analysis config --quiet
        env:
          POSTGRES_PASSWORD: ci-disposable-only
      - run: docker build -t scanner-ci .
      - run: docker run --rm -e DATABASE_URL=sqlite:////tmp/image-test.db scanner-ci alembic upgrade head
