name: Format stock monitor one shot
on:
  push:
    branches:
      - feature/stock-forward-monitor-issue-88
    paths:
      - .github/workflows/stock-monitor-format-once.yml
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stock-forward-monitor-issue-88
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.1"
          args: "format scanner/stock_monitor tests/test_stock_monitor_worker.py tests/test_stock_monitor_sec_client_runner.py tests/test_stock_monitor_coverage.py"
      - name: Apply Ruff import rules
        run: |
          ruff check --select I --fix scanner/stock_monitor tests/test_stock_monitor_worker.py tests/test_stock_monitor_sec_client_runner.py tests/test_stock_monitor_coverage.py
          ruff format scanner/stock_monitor tests/test_stock_monitor_worker.py tests/test_stock_monitor_sec_client_runner.py tests/test_stock_monitor_coverage.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/stock_monitor tests/test_stock_monitor_worker.py tests/test_stock_monitor_sec_client_runner.py tests/test_stock_monitor_coverage.py
          if ! git diff --cached --quiet; then
            git commit -m "style(stock): normalize Ruff formatting"
            git push origin HEAD:feature/stock-forward-monitor-issue-88
          fi
