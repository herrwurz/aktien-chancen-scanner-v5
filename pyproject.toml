[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-chancen-scanner"
version = "0.1.0"
description = "Read-only spot market scanner with point-in-time volume signals"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.119.1", "uvicorn==0.38.0", "SQLAlchemy==2.0.44",
  "alembic==1.17.0", "psycopg[binary]==3.2.12", "httpx==0.28.1",
  "pydantic-settings==2.11.0", "jinja2==3.1.6",
  "pdfplumber==0.11.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "PyYAML==6.0.3", "reportlab==4.4.5"]

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.setuptools.package-data]
scanner = ["templates/*.html", "hebeltrader/detective/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
